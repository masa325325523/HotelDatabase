<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; margin:0; color:#17324d; background:#f6f8fb; }
    .header { background:#183f61; color:white; padding:24px 30px; }
    .header h1 { margin:0 0 8px; font-size:27px; }
    .header p { margin:0; line-height:1.6; font-size:14px; }
    .wrap { padding:22px 28px 30px; }
    .notice { background:#eef5fb; border:1px solid #c9ddef; border-radius:10px; padding:14px 16px; line-height:1.6; margin-bottom:18px; font-size:13px; }
    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
    .card { background:white; border:1px solid #d9e2ec; border-radius:10px; padding:14px; min-height:72px; }
    .card .label { color:#64788d; font-size:12px; margin-bottom:7px; }
    .card .value { font-size:21px; font-weight:700; }
    .ok { color:#16834b; } .warning { color:#9a6500; } .critical { color:#bd2c24; } .info { color:#356b94; }
    .section { background:white; border:1px solid #d9e2ec; border-radius:10px; margin-bottom:16px; overflow:hidden; }
    .section h2 { margin:0; padding:14px 16px; background:#e9f1f8; font-size:18px; }
    .check { display:grid; grid-template-columns:82px 220px 1fr; gap:12px; padding:13px 16px; border-top:1px solid #eef1f4; align-items:start; }
    .badge { display:inline-block; border-radius:999px; padding:4px 9px; font-weight:700; font-size:12px; text-align:center; }
    .badge.ok { background:#e8f6ee; } .badge.warning { background:#fff5dc; } .badge.critical { background:#fdebea; } .badge.info { background:#eaf3fb; }
    .check .title { font-weight:700; }
    .detail { color:#607387; line-height:1.5; font-size:13px; }
    .actions { background:white; border:1px solid #d9e2ec; border-radius:10px; padding:14px 16px; margin-bottom:16px; }
    .actions h2 { margin:0 0 10px; font-size:18px; }
    .actions li { margin:7px 0; line-height:1.5; }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:18px; }
    button { border:0; border-radius:8px; padding:11px 18px; font-weight:700; cursor:pointer; }
    .primary { background:#1976b9; color:white; }
    .loading { padding:36px; text-align:center; color:#64788d; }
    .error { background:#fdebea; color:#8e211b; border-radius:8px; padding:14px; white-space:pre-wrap; }
    .small { font-size:12px; color:#6c7f91; }
    @media (max-width:760px) { .cards { grid-template-columns:repeat(2,1fr); } .check { grid-template-columns:80px 1fr; } .detail { grid-column:2; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>宿泊施設DB Ver2.0　リリース準備チェック</h1>
    <p>初期設定・ヘルスチェック・検証済みバックアップ・テスト残留を、データを書き換えずに確認します。</p>
  </div>
  <div class="wrap">
    <div class="notice">
      この画面ではGoogle Places APIを呼びません。バックアップも自動作成しません。
      APIキー本体・ハッシュは表示しません。製品リリース前に、少なくとも1件の検証済みバックアップが必要です。
    </div>
    <div id="content" class="loading">確認中...</div>
  </div>
<script>
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function badge(severity) {
    const labels = {ok:'正常', warning:'要確認', critical:'重大', info:'情報'};
    return '<span class="badge ' + esc(severity) + '">' + esc(labels[severity] || severity) + '</span>';
  }
  function overallClass(overall) {
    if (overall === 'リリース可能') return 'ok';
    if (overall === 'テスト環境') return 'info';
    return 'critical';
  }
  function render(report) {
    const groups = [
      ['必須条件', ['MODULE-SETUP','MODULE-HEALTH','MODULE-BACKUP','SETUP-API','SETUP-SOURCE','SETUP-CORE','HEALTH-CRITICAL','HEALTH-WARNING','BACKUP-EXISTS','BACKUP-NO-INPLACE']],
      ['環境・実行入口', ['ENVIRONMENT','TEST-RESIDUE','ENTRY-HEALTH','ENTRY-BACKUP','ENTRY-RELEASE']],
      ['監査・保護', ['SAFE-NO-PLACES','SAFE-NO-BACKUP-CREATE','SAFE-API-KEY','SAFE-UNCHANGED']]
    ];
    let html = '<div class="cards">' +
      '<div class="card"><div class="label">全体状態</div><div class="value ' + overallClass(report.overall) + '">' + esc(report.overall) + '</div></div>' +
      '<div class="card"><div class="label">実行環境</div><div class="value ' + (report.environment.kind === 'test' ? 'info':'ok') + '">' + esc(report.environment.label) + '</div></div>' +
      '<div class="card"><div class="label">リリース阻害</div><div class="value ' + (report.blockingCount ? 'critical':'ok') + '">' + esc(report.blockingCount) + '</div></div>' +
      '<div class="card"><div class="label">検証済みバックアップ</div><div class="value ' + (report.backupCount ? 'ok':'critical') + '">' + esc(report.backupCount) + '</div></div>' +
      '</div>';

    groups.forEach(function(group) {
      const ids = group[1];
      const items = (report.checks || []).filter(function(item){ return ids.indexOf(item.id) !== -1; });
      html += '<div class="section"><h2>' + esc(group[0]) + '</h2>';
      items.forEach(function(item) {
        html += '<div class="check"><div>' + badge(item.severity) + '</div><div class="title">' + esc(item.label) + '</div><div class="detail">' + esc(item.detail) + '</div></div>';
      });
      html += '</div>';
    });

    if (report.recommendations && report.recommendations.length) {
      html += '<div class="actions"><h2>次にやること</h2><ul>';
      report.recommendations.forEach(function(item){ html += '<li><strong>' + esc(item.label) + '</strong> — ' + esc(item.action) + '</li>'; });
      html += '</ul></div>';
    }

    html += '<div class="footer"><div class="small">確認日時: ' + esc(report.checkedAt) + ' / Google Places API呼出なし / Drive書込みなし</div>' +
      '<button class="primary" onclick="loadReport()">再チェック</button></div>';
    document.getElementById('content').className = '';
    document.getElementById('content').innerHTML = html;
  }
  function showError(error) {
    const message = error && error.message ? error.message : String(error || '不明なエラー');
    document.getElementById('content').className = 'error';
    document.getElementById('content').textContent = message;
  }
  function loadReport() {
    document.getElementById('content').className = 'loading';
    document.getElementById('content').textContent = '確認中...';
    google.script.run.withSuccessHandler(render).withFailureHandler(showError).hotelDbV2ReleaseGetReport();
  }
  loadReport();
</script>
</body>
</html>
